<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f5f1"><title>日常 · 饮食与训练</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--bg:#f6f5f1;--paper:#fff;--ink:#242720;--muted:#858980;--line:#eaeae4;--green:#53745c;--sage:#e9efe7;--lime:#d8edbb;--shadow:0 8px 28px #26351d0b;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans SC',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1220px;margin:0 auto;padding:30px 42px 34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:20px}.brand h1{font-size:19px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.3px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.datebar{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.datebar input{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;color:var(--ink)}.button{border:0;background:var(--green);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;transition:.18s}.button:hover{background:#42614b;transform:translateY(-1px)}.button.light{background:#f0f1ec;color:#42463f}.button.light:hover{background:#e7e9e2}.button.small{padding:8px 11px;font-size:12px}.welcome{display:flex;justify-content:space-between;align-items:center;background:#e9eee5;border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;overflow:hidden;position:relative}.welcome:after{content:'✳';position:absolute;right:195px;top:-30px;font-size:128px;color:#d8e2d1;font-weight:400}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--green)}.welcome h2{margin:7px 0 5px;font-size:21px;letter-spacing:-.4px}.welcome p{margin:0;color:#73786f;font-size:12px}.welcome .button{position:relative;z-index:1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);min-height:116px}.metric-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.metric-icon{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:#f0f2ec;color:var(--green);font-size:14px}.metric-value{font-size:23px;font-weight:700;letter-spacing:-.8px;margin:8px 0 2px}.metric-value small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}.metric-note{font-size:10px;color:var(--muted)}.meter{height:4px;background:#eff0eb;border-radius:6px;margin-top:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel-head{padding:18px 20px 13px;display:flex;align-items:center;justify-content:space-between}.panel-head h3{margin:0;font-size:14px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.tabs{display:flex;gap:6px;padding:0 20px 14px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;border-radius:8px;color:var(--muted);padding:7px 12px;font-size:11px}.tab.active{background:var(--sage);color:var(--green);font-weight:700}.table-wrap{padding:0 20px 14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:480px}.table th{text-align:left;color:var(--muted);font-size:10px;font-weight:500;padding:12px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid #f1f1ed;font-size:11px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.meal-name{font-weight:600;font-size:12px}.sub{display:block;color:var(--muted);font-size:10px;margin-top:3px}.pill{border-radius:20px;background:#f2f3ef;padding:4px 8px;color:#666b61;font-size:10px;white-space:nowrap}.empty{padding:46px 10px;text-align:center;color:var(--muted);font-size:12px}.empty .empty-icon{font-size:24px;opacity:.6;margin-bottom:8px}.side{display:flex;flex-direction:column;gap:18px}.target-body{padding:0 20px 19px}.goal-row{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:11px}.goal-row span:first-child{color:#70756c}.goal-row strong{font-size:12px}.barline{height:6px;border-radius:8px;background:#f0f1ec;margin-top:8px;overflow:hidden}.barline i{height:100%;display:block;background:var(--green);border-radius:8px}.barline.protein i{background:#bdcb7a}.quick{padding:18px 20px}.quick h3{margin:0 0 13px;font-size:14px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick-grid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;text-align:left;color:var(--ink);font-weight:600;font-size:11px}.quick-grid button:hover{border-color:#b9cbb7;background:#f9fbf7}.quick-grid b{display:block;color:var(--green);font-size:16px;margin-bottom:5px}.week{padding:18px 20px 14px}.week h3{margin:0;font-size:14px}.week-sub{color:var(--muted);font-size:10px;margin:4px 0 12px}.chart{height:107px;display:flex;align-items:flex-end;gap:10px;padding:5px 4px 0}.daycol{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}.daycol .barbg{height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center}.daycol i{display:block;width:14px;max-width:70%;background:#cbd8c8;border-radius:5px 5px 2px 2px;min-height:3px}.daycol.today i{background:var(--green)}.daycol label{font-size:9px;color:var(--muted)}.week-legend{margin-top:8px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.week-legend b{color:var(--ink);font-weight:600}.notice{margin-top:18px;color:#8b8f86;font-size:10px;display:flex;justify-content:space-between;gap:20px}.notice .saved{color:var(--green)}.modal-backdrop{position:fixed;inset:0;background:#161b1670;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;width:min(480px,100%);border-radius:18px;padding:22px;box-shadow:0 20px 80px #0003}.modal h2{font-size:17px;margin:0 0 5px}.modal p{font-size:11px;color:var(--muted);margin:0 0 17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#646960}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#89a48a;box-shadow:0 0 0 3px #e9efe7}.field textarea{resize:vertical;min-height:65px}.file-note{font-size:10px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#252a24;color:#fff;padding:11px 16px;border-radius:10px;font-size:12px;z-index:20;box-shadow:var(--shadow)}.delete{border:0;background:transparent;color:#a26a5e;font-size:11px}.mobile-add{display:none}
@media(max-width:900px){.app{padding:22px 24px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.week{grid-column:1/-1}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.app{padding:18px 14px 28px}.top{align-items:flex-start;gap:10px;flex-direction:column;margin-bottom:18px}.datebar{width:100%;justify-content:space-between}.datebar input{flex:1}.welcome{padding:18px}.welcome:after{right:110px}.welcome h2{font-size:17px;max-width:250px}.welcome p{max-width:250px;line-height:1.6}.welcome>.button{display:none}.metrics{gap:9px}.metric{padding:13px;min-height:105px}.metric-value{font-size:20px}.side{display:flex}.panel-head{padding:16px}.tabs{padding:0 14px 12px}.table-wrap{padding:0 12px 12px}.notice{flex-direction:column;gap:6px}.mobile-add{display:block;position:fixed;bottom:17px;right:17px;z-index:4;border-radius:50%;width:54px;height:54px;font-size:23px;box-shadow:0 7px 20px #283b2c40}.modal{padding:19px}.form-grid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">✳</div><div><h1>日常 · 饮食与训练</h1><p>记录一点点，感受长期的变化</p></div></div><div class="datebar"><span>查看日期</span><input id="date" type="date"><button class="button light small" id="todayBtn">今天</button></div></header>
<section class="welcome"><div><div class="eyebrow">YOUR DAILY JOURNAL</div><h2 id="greeting">今天也为自己留一点记录</h2><p>身体的变化来自每一天的积累，记下此刻就很好。</p></div><button class="button" data-add="meal">＋ 记录一餐</button></section>
<section class="metrics" id="metrics"></section>
<section class="layout"><div class="panel"><div class="panel-head"><div><h3 id="logTitle">今日记录</h3><p>为日常留下一点真实的数据</p></div><button class="button light small" id="exportBtn">导出记录</button></div><nav class="tabs"><button class="tab active" data-tab="meals">饮食</button><button class="tab" data-tab="training">训练</button><button class="tab" data-tab="wellness">身体状态</button></nav><div id="logContent"></div></div>
<aside class="side"><section class="panel"><div class="panel-head"><div><h3>今日目标</h3><p>按你的节奏调整，不必追求完美</p></div><button class="button light small" id="goalBtn">编辑</button></div><div class="target-body" id="targets"></div></section>
<section class="panel quick"><h3>快速记录</h3><div class="quick-grid"><button data-add="meal"><b>＋</b>添加一餐</button><button data-add="training"><b>↗</b>记录训练</button><button data-add="wellness"><b>◉</b>身体状态</button><button id="weightQuick"><b>↕</b>记录体重</button></div></section>
<section class="panel week"><h3>近 7 天</h3><p class="week-sub">每天摄入热量估算</p><div id="chart" class="chart"></div><div id="weekLegend" class="week-legend"></div></section></aside></section>
<footer class="notice"><span>热量与营养数据为个人估算，请按实际份量填写或修正。</span><span>数据仅保存在这台电脑 · <span class="saved" id="saveState">已连接本机</span></span></footer>
</main><button class="button mobile-add" data-add="meal" aria-label="添加记录">＋</button><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const emptyData=()=>({settings:{calories:2000,protein:140},meals:[],training:[],wellness:[]});let db=emptyData();let activeTab='meals';let selectedDate=new Date().toISOString().slice(0,10);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dayRows=(k,d=selectedDate)=>db[k].filter(x=>x.date===d);const sum=(xs,k)=>xs.reduce((a,x)=>a+(Number(x[k])||0),0);const fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:1});
async function persist(){try{$('#saveState').textContent='正在保存…';const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(!r.ok)throw Error();$('#saveState').textContent='已保存在本机'}catch{$('#saveState').textContent='保存失败，请重新启动应用';toast('本地保存失败')}}
async function init(){try{const r=await fetch('/api/data');if(!r.ok)throw Error();const d=await r.json();db={...emptyData(),...d,settings:{...emptyData().settings,...d.settings}}}catch{toast('无法连接本机数据服务，请双击启动文件重新打开')}$('#date').value=selectedDate;render()}
function render(){const meals=dayRows('meals'),training=dayRows('training'),well=dayRows('wellness')[0]||{};const kcal=sum(meals,'kcal'),protein=sum(meals,'protein'),goalK=Number(db.settings.calories)||2000,goalP=Number(db.settings.protein)||140;$('#greeting').textContent=new Date(selectedDate+'T12:00:00').toDateString()===new Date().toDateString()?'今天也为自己留一点记录':selectedDate+' · 日常记录';$('#logTitle').textContent=selectedDate===new Date().toISOString().slice(0,10)?'今日记录':selectedDate+' 记录';
$('#metrics').innerHTML=`<article class="metric"><div class="metric-head"><span>摄入热量</span><span class="metric-icon">◒</span></div><div class="metric-value">${fmt(kcal)} <small>/ ${fmt(goalK)} kcal</small></div><div class="meter"><i style="width:${Math.min(100,kcal/goalK*100)}%"></i></div><div class="metric-note">${meals.length} 餐记录</div></article><article class="metric"><div class="metric-head"><span>蛋白质</span><span class="metric-icon">⌁</span></div><div class="metric-value">${fmt(protein)} <small>/ ${fmt(goalP)} g</small></div><div class="meter"><i style="width:${Math.min(100,protein/goalP*100)}%;background:#bdcb7a"></i></div><div class="metric-note">${protein>=goalP?'已达到今日目标':`还差 ${fmt(goalP-protein)} g`}</div></article><article class="metric"><div class="metric-head"><span>训练活动</span><span class="metric-icon">↗</span></div><div class="metric-value">${training.length} <small>项</small></div><div class="metric-note">记录动作、组数与训练重量</div></article><article class="metric"><div class="metric-head"><span>体重 · 睡眠</span><span class="metric-icon">☾</span></div><div class="metric-value">${well.weight?esc(well.weight):'—'} <small>kg</small></div><div class="metric-note">睡眠 ${well.sleep?esc(well.sleep):'—'} 小时</div></article>`;
$('#targets').innerHTML=`<div class="goal-row"><span>热量</span><strong>${fmt(kcal)} <span class="sub" style="display:inline">/ ${fmt(goalK)} kcal</span></strong></div><div class="barline"><i style="width:${Math.min(100,kcal/goalK*100)}%"></i></div><div class="goal-row"><span>蛋白质</span><strong>${fmt(protein)} <span class="sub" style="display:inline">/ ${fmt(goalP)} g</span></strong></div><div class="barline protein"><i style="width:${Math.min(100,protein/goalP*100)}%"></i></div>`;
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));renderLog();renderChart()}
function renderLog(){let rows=dayRows(activeTab==='meals'?'meals':activeTab==='training'?'training':'wellness');let html='';if(activeTab==='meals'){html=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>餐次</th><th>食物与份量</th><th>热量</th><th>蛋白质</th><th></th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td><span class="pill">${esc(x.meal)}</span><span class="sub">${esc(x.time)}</span></td><td><span class="meal-name">${esc(x.foods)}</span>${x.photo?`<span class="sub">📎 ${esc(x.photo.split(/[\\/]/).pop())}</span>`:''}${x.note?`<span class="sub">${esc(x.note)}</span>`:''}</td><td>${x.kcal?fmt(x.kcal)+' kcal':'—'}</td><td>${x.protein?fmt(x.protein)+' g':'—'}</td><td><button class="delete" data-delete="meals" data-index="${i}">删除</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">◌</div>还没有饮食记录<br>从第一餐开始，慢慢建立自己的节奏</div>`}
else if(activeTab==='training'){html=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>训练项目</th><th>动作 / 组数 / 次数 / 重量</th><th>时长</th><th></th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${esc(x.time)}</td><td><span class="meal-name">${esc(x.type)}</span></td><td>${esc(x.details||'—')}</td><td>${x.duration?esc(x.duration)+' 分钟':'—'}</td><td><button class="delete" data-delete="training" data-index="${i}">删除</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">↗</div>今天还没有训练记录<br>休息日也值得被记录</div>`}
else{html=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>体重</th><th>睡眠</th><th>状态备注</th><th></th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${x.weight?esc(x.weight)+' kg':'—'}</td><td>${x.sleep?esc(x.sleep)+' 小时':'—'}</td><td>${esc(x.note||'—')}</td><td><button class="delete" data-delete="wellness" data-index="${i}">删除</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">☾</div>记下体重和睡眠，观察长期变化</div>`}$('#logContent').innerHTML=html}
function renderChart(){const end=new Date(selectedDate+'T12:00:00'),days=[];for(let i=6;i>=0;i--){let d=new Date(end);d.setDate(d.getDate()-i);const iso=d.toISOString().slice(0,10);days.push({iso,label:['日','一','二','三','四','五','六'][d.getDay()],value:sum(db.meals.filter(x=>x.date===iso),'kcal')})}const max=Math.max(Number(db.settings.calories)||2000,...days.map(x=>x.value),1);$('#chart').innerHTML=days.map((x,i)=>`<div class="daycol ${i===6?'today':''}" title="${x.iso} · ${fmt(x.value)} kcal"><div class="barbg"><i style="height:${Math.max(x.value?4:2,x.value/max*70)}px"></i></div><label>${x.label}</label></div>`).join('');const avg=days.reduce((s,x)=>s+x.value,0)/7;$('#weekLegend').innerHTML=`<span>七日平均 <b>${fmt(avg)} kcal</b></span><span>${days[6].iso.slice(5)}</span>`}
function modal(title,subtitle,fields,onSave){$('#modalRoot').innerHTML=`<div class="modal-backdrop"><form class="modal"><h2>${title}</h2><p>${subtitle}</p><div class="form-grid">${fields.map(f=>`<div class="field ${f.full?'full':''}"><label>${f.label}</label>${f.options?`<select name="${f.name}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`:f.area?`<textarea name="${f.name}" placeholder="${f.placeholder||''}"></textarea>`:`<input name="${f.name}" type="${f.type||'text'}" step="any" placeholder="${f.placeholder||''}" ${f.required?'required':''} ${f.value!==undefined?`value="${esc(f.value)}"`:''}>`}</div>`).join('')}</div><div class="modal-actions"><button type="button" class="button light" data-cancel>取消</button><button type="submit" class="button">保存记录</button></div></form></div>`;const back=$('.modal-backdrop');back.addEventListener('click',e=>{if(e.target===back)$('#modalRoot').innerHTML=''});$('[data-cancel]').onclick=()=>$('#modalRoot').innerHTML='';$('.modal').onsubmit=async e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.currentTarget));await onSave(values);$('#modalRoot').innerHTML='';render()}}
function addMeal(){modal('记录一餐','填写食物名称和大致份量；营养数据可以估算后再修改。',[{name:'meal',label:'餐次',options:['早餐','午餐','晚餐','加餐']},{name:'time',label:'时间',type:'time',value:new Date().toTimeString().slice(0,5)},{name:'foods',label:'食物与份量',placeholder:'例如：米饭一碗、鸡胸肉约 150 g',full:true,required:true},{name:'kcal',label:'热量估算（kcal）',type:'number',placeholder:'可留空'},{name:'protein',label:'蛋白质估算（g）',type:'number',placeholder:'可留空'},{name:'photo',label:'照片路径（可选）',placeholder:'可在之后添加',full:true},{name:'note',label:'备注（可选）',area:true,full:true}],async v=>{db.meals.push({date:selectedDate,...v});await persist()})}
function addTraining(){modal('记录训练','记下今天的动作、训练量和感受。',[{name:'type',label:'训练类型',options:['力量训练','有氧训练','散步 / 活动','其他']},{name:'time',label:'时间',type:'time',value:new Date().toTimeString().slice(0,5)},{name:'details',label:'动作 / 组数 / 次数 / 重量',placeholder:'例如：深蹲 3 组 × 12 次，40 kg',full:true},{name:'duration',label:'时长（分钟）',type:'number',placeholder:'可留空'},{name:'weight',label:'体重（kg）',type:'number',placeholder:'可留空'},{name:'note',label:'训练备注',area:true,full:true}],async v=>{db.training.push({date:selectedDate,...v});await persist()})}
function addWellness(){const old=dayRows('wellness')[0]||{};modal('记录身体状态','用趋势了解自己，不必过度解读单日波动。',[{name:'weight',label:'体重（kg）',type:'number',value:old.weight||'',placeholder:'可留空'},{name:'sleep',label:'睡眠（小时）',type:'number',value:old.sleep||'',placeholder:'可留空'},{name:'note',label:'状态备注',area:true,full:true,value:old.note||'',placeholder:'精神、饥饿感或恢复情况'}],async v=>{db.wellness=db.wellness.filter(x=>x.date!==selectedDate);db.wellness.push({date:selectedDate,...v});await persist()})}
function editGoals(){modal('编辑每日目标','目标用于帮助观察习惯，可随时按自己的需要调整。',[{name:'calories',label:'热量目标（kcal）',type:'number',value:db.settings.calories,required:true},{name:'protein',label:'蛋白质目标（g）',type:'number',value:db.settings.protein,required:true}],async v=>{db.settings={calories:Number(v.calories)||2000,protein:Number(v.protein)||140};await persist()})}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2800)}
document.addEventListener('click',async e=>{const add=e.target.closest('[data-add]');if(add){({meal:addMeal,training:addTraining,wellness:addWellness}[add.dataset.add])();return}const tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;renderLog();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===tab));return}const del=e.target.closest('[data-delete]');if(del){const key=del.dataset.delete;const rows=dayRows(key);rows.splice(Number(del.dataset.index),1);db[key]=db[key].filter(x=>x.date!==selectedDate).concat(rows);await persist();render();return}});
$('#date').addEventListener('change',e=>{selectedDate=e.target.value;render()});$('#todayBtn').onclick=()=>{$('#date').value=new Date().toISOString().slice(0,10);selectedDate=$('#date').value;render()};$('#goalBtn').onclick=editGoals;$('#weightQuick').onclick=addWellness;$('#exportBtn').onclick=()=>{const rows=[['类型','日期','时间','餐次/项目','内容','热量 kcal','蛋白质 g','备注']];db.meals.forEach(x=>rows.push(['饮食',x.date,x.time,x.meal,x.foods,x.kcal,x.protein,x.note]));db.training.forEach(x=>rows.push(['训练',x.date,x.time,x.type,x.details,'','',x.note]));db.wellness.forEach(x=>rows.push(['状态',x.date,'','身体状态','', '', '',`体重 ${x.weight||''} kg；睡眠 ${x.sleep||''} 小时；${x.note||''}`]));const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='饮食训练记录.csv';a.click();URL.revokeObjectURL(a.href)};
init();
</script></body></html>
