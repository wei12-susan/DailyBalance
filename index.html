<head>

<meta name="theme-color" content="#f6f5f1"><title>日常 · 饮食与训练</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');
:root{--bg:#f6f5f1;--paper:#fff;--ink:#242720;--muted:#858980;--line:#eaeae4;--green:#53745c;--sage:#e9efe7;--lime:#d8edbb;--shadow:0 8px 28px #26351d0b;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans SC',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1220px;margin:0 auto;padding:30px 42px 34px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:14px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:20px}.brand h1{font-size:19px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.3px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.datebar{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.datebar input{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;color:var(--ink)}.button{border:0;background:var(--green);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;transition:.18s}.button:hover{background:#42614b;transform:translateY(-1px)}.button.light{background:#f0f1ec;color:#42463f}.button.light:hover{background:#e7e9e2}.button.small{padding:8px 11px;font-size:12px}.welcome{display:flex;justify-content:space-between;align-items:center;background:#e9eee5;border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;overflow:hidden;position:relative}.welcome:after{content:'✳';position:absolute;right:195px;top:-30px;font-size:128px;color:#d8e2d1;font-weight:400}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--green)}.welcome h2{margin:7px 0 5px;font-size:21px;letter-spacing:-.4px}.welcome p{margin:0;color:#73786f;font-size:12px}.welcome .button{position:relative;z-index:1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);min-height:116px}.metric-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.metric-icon{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:#f0f2ec;color:var(--green);font-size:14px}.metric-value{font-size:23px;font-weight:700;letter-spacing:-.8px;margin:8px 0 2px}.metric-value small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}.metric-note{font-size:10px;color:var(--muted)}.meter{height:4px;background:#eff0eb;border-radius:6px;margin-top:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel-head{padding:18px 20px 13px;display:flex;align-items:center;justify-content:space-between}.panel-head h3{margin:0;font-size:14px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.tabs{display:flex;gap:6px;padding:0 20px 14px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;border-radius:8px;color:var(--muted);padding:7px 12px;font-size:11px}.tab.active{background:var(--sage);color:var(--green);font-weight:700}.table-wrap{padding:0 20px 14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:480px}.table th{text-align:left;color:var(--muted);font-size:10px;font-weight:500;padding:12px 8px;border-bottom:1px solid var(--line)}.table td{padding:13px 8px;border-bottom:1px solid #f1f1ed;font-size:11px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.meal-name{font-weight:600;font-size:12px}.sub{display:block;color:var(--muted);font-size:10px;margin-top:3px}.pill{border-radius:20px;background:#f2f3ef;padding:4px 8px;color:#666b61;font-size:10px;white-space:nowrap}.empty{padding:46px 10px;text-align:center;color:var(--muted);font-size:12px}.empty .empty-icon{font-size:24px;opacity:.6;margin-bottom:8px}.side{display:flex;flex-direction:column;gap:18px}.target-body{padding:0 20px 19px}.goal-row{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:11px}.goal-row span:first-child{color:#70756c}.goal-row strong{font-size:12px}.barline{height:6px;border-radius:8px;background:#f0f1ec;margin-top:8px;overflow:hidden}.barline i{height:100%;display:block;background:var(--green);border-radius:8px}.barline.protein i{background:#bdcb7a}.quick{padding:18px 20px}.quick h3{margin:0 0 13px;font-size:14px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick-grid button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 10px;text-align:left;color:var(--ink);font-weight:600;font-size:11px}.quick-grid button:hover{border-color:#b9cbb7;background:#f9fbf7}.quick-grid b{display:block;color:var(--green);font-size:16px;margin-bottom:5px}.week{padding:18px 20px 14px}.week h3{margin:0;font-size:14px}.week-sub{color:var(--muted);font-size:10px;margin:4px 0 12px}.chart{height:107px;display:flex;align-items:flex-end;gap:10px;padding:5px 4px 0}.daycol{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}.daycol .barbg{height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center}.daycol i{display:block;width:14px;max-width:70%;background:#cbd8c8;border-radius:5px 5px 2px 2px;min-height:3px}.daycol.today i{background:var(--green)}.daycol label{font-size:9px;color:var(--muted)}.week-legend{margin-top:8px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.week-legend b{color:var(--ink);font-weight:600}.notice{margin-top:18px;color:#8b8f86;font-size:10px;display:flex;justify-content:space-between;gap:20px}.notice .saved{color:var(--green)}.modal-backdrop{position:fixed;inset:0;background:#161b1670;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;width:min(480px,100%);border-radius:18px;padding:22px;box-shadow:0 20px 80px #0003}.modal h2{font-size:17px;margin:0 0 5px}.modal p{font-size:11px;color:var(--muted);margin:0 0 17px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#646960}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#89a48a;box-shadow:0 0 0 3px #e9efe7}.field textarea{resize:vertical;min-height:65px}.file-note{font-size:10px;color:var(--muted)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#252a24;color:#fff;padding:11px 16px;border-radius:10px;font-size:12px;z-index:20;box-shadow:var(--shadow)}.delete{border:0;background:transparent;color:#a26a5e;font-size:11px}.mobile-add{display:none}
@media(max-width:900px){.app{padding:22px 24px}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.week{grid-column:1/-1}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.app{padding:18px 14px 28px}.top{align-items:flex-start;gap:10px;flex-direction:column;margin-bottom:18px}.datebar{width:100%;justify-content:space-between}.datebar input{flex:1}.welcome{padding:18px}.welcome:after{right:110px}.welcome h2{font-size:17px;max-width:250px}.welcome p{max-width:250px;line-height:1.6}.welcome>.button{display:none}.metrics{gap:9px}.metric{padding:13px;min-height:105px}.metric-value{font-size:20px}.side{display:flex}.panel-head{padding:16px}.tabs{padding:0 14px 12px}.table-wrap{padding:0 12px 12px}.notice{flex-direction:column;gap:6px}.mobile-add{display:block;position:fixed;bottom:17px;right:17px;z-index:4;border-radius:50%;width:54px;height:54px;font-size:23px;box-shadow:0 7px 20px #283b2c40}.modal{padding:19px}.form-grid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}}

.food-entry{min-height:100px;line-height:1.65}.estimate-preview{margin-top:8px;padding:11px 12px;border-radius:10px;background:#f5f7f2;color:#4d624f;font-size:11px;line-height:1.8}.estimate-preview .estimate-total{font-weight:700;color:#344e39}.estimate-preview .estimate-warn{display:block;color:#9b6d36;margin-top:3px}.estimate-preview .estimate-items{display:block;color:#747a70}.food-result{padding:5px 0;border-bottom:1px solid #e5e9e1}.food-result label{display:block;font-weight:600}.food-result select{display:block;width:100%;margin-top:5px;border:1px solid #dfe5dc;border-radius:7px;padding:7px;background:white;color:#343a33;font-size:11px}.food-result .estimate-warn{color:#9b6d36}.bmi-preview{padding:10px 12px;border-radius:9px;background:#f5f7f2;color:#53745c;font-weight:700}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">✳</div><div><h1>日常 · 饮食与训练</h1><p>记录一点点，感受长期的变化</p></div></div><div class="datebar"><span>查看日期</span><input id="date" type="date"><button class="button light small" id="todayBtn">今天</button></div></header>
<section class="welcome"><div><div class="eyebrow">YOUR DAILY JOURNAL</div><h2 id="greeting">今天也为自己留一点记录</h2><p>身体的变化来自每一天的积累，记下此刻就很好。</p></div><button class="button" data-add="meal">＋ 记录一餐</button></section>
<section class="metrics" id="metrics"></section>
<section class="layout"><div class="panel"><div class="panel-head"><div><h3 id="logTitle">今日记录</h3><p>为日常留下一点真实的数据</p></div><button class="button light small" id="exportBtn">导出记录</button></div><nav class="tabs"><button class="tab active" data-tab="meals">饮食</button><button class="tab" data-tab="training">训练</button><button class="tab" data-tab="wellness">身体状态</button></nav><div id="logContent"></div></div>
<aside class="side"><section class="panel"><div class="panel-head"><div><h3>今日目标</h3><p>按你的节奏调整，不必追求完美</p></div><button class="button light small" id="goalBtn">编辑</button></div><div class="target-body" id="targets"></div></section>
<section class="panel quick"><h3>快速记录</h3><div class="quick-grid"><button data-add="meal"><b>＋</b>添加一餐</button><button data-add="training"><b>↗</b>记录训练</button><button data-add="wellness"><b>◉</b>身体状态</button></div></section>
<section class="panel week"><h3>近 7 天</h3><p class="week-sub">每天摄入热量估算</p><div id="chart" class="chart"></div><div id="weekLegend" class="week-legend"></div></section></aside></section>
<footer class="notice"><span>热量与营养数据为个人估算，请按实际份量填写或修正。</span><span>数据仅保存在这台电脑 · <span class="saved" id="saveState">已连接本机</span></span></footer>
</main><button class="button mobile-add" data-add="meal" aria-label="添加记录">＋</button><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const emptyData=()=>({settings:{calories:2000,protein:140,height:0},meals:[],training:[],wellness:[]});let db=emptyData();let activeTab='meals';let selectedDate=new Date().toISOString().slice(0,10);let reconnectTimer=null;let pendingSave=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dayRows=(k,d=selectedDate)=>db[k].filter(x=>x.date===d);const sum=(xs,k)=>xs.reduce((a,x)=>a+(Number(x[k])||0),0);const bmiFor=(weight,height)=>{const w=Number(weight),h=Number(height);return w>0&&h>0?w/((h/100)**2):0};const fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:1});
function watchConnection(){if(reconnectTimer)return;reconnectTimer=setInterval(async()=>{try{if(pendingSave){const saved=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(!saved.ok)throw Error();pendingSave=false}else{const r=await fetch('/api/data');if(!r.ok)throw Error();const d=await r.json();db={...emptyData(),...d,settings:{...emptyData().settings,...d.settings}}}clearInterval(reconnectTimer);reconnectTimer=null;$('#saveState').textContent=pendingSave?'保存待重试':'已连接本机';render();toast('本机数据服务已恢复')}catch{}},2500)}
async function persist(){try{$('#saveState').textContent='正在保存…';const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});if(!r.ok)throw Error();pendingSave=false;$('#saveState').textContent='已保存在本机'}catch{pendingSave=true;$('#saveState').textContent='等待本机服务恢复';toast('暂时无法连接本机服务，记录会保留并自动重试');watchConnection()}}
async function init(){try{const r=await fetch('/api/data');if(!r.ok)throw Error();const d=await r.json();db={...emptyData(),...d,settings:{...emptyData().settings,...d.settings}};$('#saveState').textContent='已连接本机'}catch{$('#saveState').textContent='正在重连本机服务';toast('正在连接本机数据服务…');watchConnection()}$('#date').value=selectedDate;render()}
function render(){const meals=dayRows('meals'),training=dayRows('training'),well=dayRows('wellness')[0]||{};const kcal=sum(meals,'kcal'),protein=sum(meals,'protein'),goalK=Number(db.settings.calories)||2000,goalP=Number(db.settings.protein)||140;$('#greeting').textContent=new Date(selectedDate+'T12:00:00').toDateString()===new Date().toDateString()?'今天也为自己留一点记录':selectedDate+' · 日常记录';$('#logTitle').textContent=selectedDate===new Date().toISOString().slice(0,10)?'今日记录':selectedDate+' 记录';
$('#metrics').innerHTML=`<article class="metric"><div class="metric-head"><span>摄入热量</span><span class="metric-icon">◒</span></div><div class="metric-value">${fmt(kcal)} <small>/ ${fmt(goalK)} kcal</small></div><div class="meter"><i style="width:${Math.min(100,kcal/goalK*100)}%"></i></div><div class="metric-note">${meals.length} 餐记录</div></article><article class="metric"><div class="metric-head"><span>蛋白质</span><span class="metric-icon">⌁</span></div><div class="metric-value">${fmt(protein)} <small>/ ${fmt(goalP)} g</small></div><div class="meter"><i style="width:${Math.min(100,protein/goalP*100)}%;background:#bdcb7a"></i></div><div class="metric-note">${protein>=goalP?'已达到今日目标':`还差 ${fmt(goalP-protein)} g`}</div></article><article class="metric"><div class="metric-head"><span>训练活动</span><span class="metric-icon">↗</span></div><div class="metric-value">${training.length} <small>项</small></div><div class="metric-note">记录动作、组数与训练重量</div></article><article class="metric"><div class="metric-head"><span>体重 · 睡眠</span><span class="metric-icon">☾</span></div><div class="metric-value">${well.weight?esc(well.weight):'—'} <small>kg</small></div><div class="metric-note">BMI ${well.bmi||bmiFor(well.weight,well.height||db.settings.height)?fmt(well.bmi||bmiFor(well.weight,well.height||db.settings.height)):'—'} · 睡眠 ${well.sleep?esc(well.sleep):'—'} 小时</div></article>`;
$('#targets').innerHTML=`<div class="goal-row"><span>热量</span><strong>${fmt(kcal)} <span class="sub" style="display:inline">/ ${fmt(goalK)} kcal</span></strong></div><div class="barline"><i style="width:${Math.min(100,kcal/goalK*100)}%"></i></div><div class="goal-row"><span>蛋白质</span><strong>${fmt(protein)} <span class="sub" style="display:inline">/ ${fmt(goalP)} g</span></strong></div><div class="barline protein"><i style="width:${Math.min(100,protein/goalP*100)}%"></i></div>`;
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));renderLog();renderChart()}
function renderLog(){let rows=dayRows(activeTab==='meals'?'meals':activeTab==='training'?'training':'wellness');let html='';if(activeTab==='meals'){html=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>餐次</th><th>食物与份量</th><th>热量</th><th>蛋白质</th><th></th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td><span class="pill">${esc(x.meal)}</span><span class="sub">${esc(x.time)}</span></td><td><span class="meal-name">${esc(x.foods)}</span>${x.photo?`<span class="sub">📎 ${esc(x.photo.split(/[\\/]/).pop())}</span>`:''}${x.note?`<span class="sub">${esc(x.note)}</span>`:''}</td><td>${x.kcal?fmt(x.kcal)+' kcal':'—'}</td><td>${x.protein?fmt(x.protein)+' g':'—'}</td><td><button class="delete" data-delete="meals" data-index="${i}">删除</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">◌</div>还没有饮食记录<br>从第一餐开始，慢慢建立自己的节奏</div>`}
else if(activeTab==='training'){html=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>训练项目</th><th>动作 / 组数 / 次数 / 重量</th><th>时长</th><th></th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${esc(x.time)}</td><td><span class="meal-name">${esc(x.type)}</span></td><td>${esc(x.details||'—')}</td><td>${x.duration?esc(x.duration)+' 分钟':'—'}</td><td><button class="delete" data-delete="training" data-index="${i}">删除</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">↗</div>今天还没有训练记录<br>休息日也值得被记录</div>`}
else{html=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>身高</th><th>体重</th><th>BMI</th><th>睡眠</th><th>状态备注</th><th></th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${x.height||db.settings.height?esc(x.height||db.settings.height)+' cm':'—'}</td><td>${x.weight?esc(x.weight)+' kg':'—'}</td><td>${x.bmi||bmiFor(x.weight,x.height||db.settings.height)?fmt(x.bmi||bmiFor(x.weight,x.height||db.settings.height)):'—'}</td><td>${x.sleep?esc(x.sleep)+' 小时':'—'}</td><td>${esc(x.note||'—')}</td><td><button class="delete" data-delete="wellness" data-index="${i}">删除</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">☾</div>记录身高、体重、BMI 和睡眠</div>`}$('#logContent').innerHTML=html}
function renderChart(){const end=new Date(selectedDate+'T12:00:00'),days=[];for(let i=6;i>=0;i--){let d=new Date(end);d.setDate(d.getDate()-i);const iso=d.toISOString().slice(0,10);days.push({iso,label:['日','一','二','三','四','五','六'][d.getDay()],value:sum(db.meals.filter(x=>x.date===iso),'kcal')})}const max=Math.max(Number(db.settings.calories)||2000,...days.map(x=>x.value),1);$('#chart').innerHTML=days.map((x,i)=>`<div class="daycol ${i===6?'today':''}" title="${x.iso} · ${fmt(x.value)} kcal"><div class="barbg"><i style="height:${Math.max(x.value?4:2,x.value/max*70)}px"></i></div><label>${x.label}</label></div>`).join('');const avg=days.reduce((s,x)=>s+x.value,0)/7;$('#weekLegend').innerHTML=`<span>七日平均 <b>${fmt(avg)} kcal</b></span><span>${days[6].iso.slice(5)}</span>`}
function modal(title,subtitle,fields,onSave){$('#modalRoot').innerHTML=`<div class="modal-backdrop"><form class="modal"><h2>${title}</h2><p>${subtitle}</p><div class="form-grid">${fields.map(f=>`<div class="field ${f.full?'full':''}"><label>${f.label}</label>${f.options?`<select name="${f.name}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`:f.preview?'<div class="bmi-preview" id="bmiPreview"></div>':f.area?`<textarea class="${f.foodEntry?'food-entry':''}" name="${f.name}" placeholder="${f.placeholder||''}">${esc(f.value||'')}</textarea>${f.foodEntry?'<div class="estimate-preview" id="estimatePreview">每行输入一种食物和克数，例如：米饭 200g</div>':''}`:`<input name="${f.name}" type="${f.type||'text'}" step="any" placeholder="${f.placeholder||''}" ${f.required?'required':''} ${f.value!==undefined?`value="${esc(f.value)}"`:''}>`}</div>`).join('')}</div><div class="modal-actions"><button type="button" class="button light" data-cancel>取消</button><button type="submit" class="button">保存记录</button></div></form></div>`;const back=$('.modal-backdrop');back.addEventListener('click',e=>{if(e.target===back)$('#modalRoot').innerHTML=''});$('[data-cancel]').onclick=()=>$('#modalRoot').innerHTML='';const foodInput=$('[name="foods"]');if(foodInput?.classList.contains('food-entry'))setupFoodLookup(foodInput);const heightInput=$('[name="height"]'),weightInput=$('[name="weight"]');if(heightInput&&weightInput){const updateBmi=()=>{const h=Number(heightInput.value),w=Number(weightInput.value),preview=$('#bmiPreview');preview.textContent=h>0&&w>0?'BMI '+(w/((h/100)**2)).toFixed(1):'填写身高和体重后自动计算'};heightInput.addEventListener('input',updateBmi);weightInput.addEventListener('input',updateBmi);updateBmi()}$('.modal').onsubmit=async e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.currentTarget));const foodInput=$('[name="foods"]');if(foodInput?.getFoodRows)values.foodItems=foodInput.getFoodRows();await onSave(values);$('#modalRoot').innerHTML='';render()}}
function setupFoodLookup(input){
 const preview=$('#estimatePreview'),kcalField=$('[name="kcal"]'),proteinField=$('[name="protein"]');let rows=[],timer=0,requestId=0;
 const parse=line=>{let m=line.match(/(\d+(?:\.\d+)?)\s*(kg|公斤|千克|g|克)/i),grams;if(m){grams=Number(m[1])*(/kg|公斤|千克/i.test(m[2])?1000:1)}else{m=line.match(/(kg|公斤|千克|g|克)\s*(\d+(?:\.\d+)?)/i);if(m)grams=Number(m[2])*(/kg|公斤|千克/i.test(m[1])?1000:1)}let name=line.replace(/\d+(?:\.\d+)?\s*(?:kg|公斤|千克|g|克)/ig,'').replace(/(?:kg|公斤|千克|g|克)\s*\d+(?:\.\d+)?/ig,'').trim();return {line:line,grams:grams||0,name:name,foods:[],selected:null,error:''}};
 const calculate=()=>{const valid=rows.filter(x=>x.selected&&x.grams>0),kcal=valid.reduce((n,x)=>n+x.selected.kcalPer100g*x.grams/100,0),protein=valid.reduce((n,x)=>n+x.selected.proteinPer100g*x.grams/100,0);kcalField.value=valid.length?Math.round(kcal):'';proteinField.value=valid.length?Math.round(protein*10)/10:'';preview.replaceChildren();if(!rows.length){preview.textContent='每行输入一种食物和克数，例如：米饭 200g';return}rows.forEach((row,index)=>{const block=document.createElement('div');block.className='food-result';if(row.error){block.textContent=row.line+'：'+row.error;block.classList.add('estimate-warn')}else if(!row.foods.length){block.textContent=row.line+'：未找到匹配食物'}else{const label=document.createElement('label');label.textContent=row.line+'（'+row.grams+'g）';const select=document.createElement('select');select.setAttribute('data-index',index);row.foods.forEach((food,i)=>{const option=document.createElement('option');option.value=String(i);option.textContent=food.name+' · '+food.kcalPer100g+' kcal/100g';option.selected=row.selected&&row.selected.code===food.code;select.append(option)});select.onchange=()=>{row.selected=row.foods[Number(select.value)];calculate()};label.append(select);const note=document.createElement('span');note.className='sub';note.textContent=row.selected?Math.round(row.selected.kcalPer100g*row.grams/100)+' kcal · 蛋白质 '+(row.selected.proteinPer100g*row.grams/100).toFixed(1)+'g · 编码 '+row.selected.code:'请选择匹配项';block.append(label,note)}preview.append(block)});const total=document.createElement('strong');total.className='estimate-total';total.textContent=valid.length?'合计 '+Math.round(kcal)+' kcal · 蛋白质 '+(Math.round(protein*10)/10)+'g':'请输入重量（克或公斤）；不会套用默认份量';preview.append(total)};
 input.addEventListener('input',()=>{clearTimeout(timer);const id=++requestId;timer=setTimeout(async()=>{rows=input.value.split(/[，,、;；+\n]+|和|及/).map(s=>s.trim()).filter(Boolean).map(parse);for(const row of rows){if(!row.grams){row.error='请写明重量，例如 200g';continue}if(!row.name){row.error='请输入食物名称';continue}try{const response=await fetch('/api/foods/search?q='+encodeURIComponent(row.name));const data=await response.json();row.foods=data.foods||[];row.selected=row.foods[0]||null;if(!data.databaseAvailable)row.error='本机营养数据库缺失'}catch{row.error='查询失败，请检查本机服务'}}if(id===requestId)calculate()},350)});input.getFoodRows=()=>rows.filter(x=>x.selected&&x.grams>0).map(x=>({code:x.selected.code,name:x.selected.name,grams:x.grams,kcal:Math.round(x.selected.kcalPer100g*x.grams/100),protein:Math.round(x.selected.proteinPer100g*x.grams/100*10)/10}));
}

function addMeal(){modal('记录一餐','每行输入一种食物和克数。请选择中国食物成分表中的匹配项，热量按每100克数据和实际重量计算。',[{name:'meal',label:'餐次',options:['早餐','午餐','晚餐','加餐']},{name:'time',label:'时间',type:'time',value:new Date().toTimeString().slice(0,5)},{name:'foods',label:'食物内容与份量',area:true,foodEntry:true,placeholder:'例如：米饭 200g\n鸡胸肉 120g',full:true,required:true},{name:'kcal',label:'热量估算（kcal，可修改）',type:'number',placeholder:'自动计算'},{name:'protein',label:'蛋白质估算（g，可修改）',type:'number',placeholder:'自动计算'},{name:'photo',label:'照片路径（可选）',placeholder:'可选',full:true},{name:'note',label:'备注（可选）',area:true,full:true}],async v=>{const items=v.foodItems||[];const totalKcal=items.reduce((n,x)=>n+x.kcal,0),totalProtein=items.reduce((n,x)=>n+x.protein,0);db.meals.push({date:selectedDate,...v,kcal:v.kcal||Math.round(totalKcal),protein:v.protein||Math.round(totalProtein*10)/10,estimateDetails:items});delete db.meals.at(-1).foodItems;await persist()})}
function addTraining(){modal('记录训练','记下今天的动作、训练量和感受。',[{name:'type',label:'训练类型',options:['力量训练','有氧训练','散步 / 活动','其他']},{name:'time',label:'时间',type:'time',value:new Date().toTimeString().slice(0,5)},{name:'details',label:'动作 / 组数 / 次数 / 重量',placeholder:'例如：深蹲 3 组 × 12 次，40 kg',full:true},{name:'duration',label:'时长（分钟）',type:'number',placeholder:'可留空'},{name:'weight',label:'体重（kg）',type:'number',placeholder:'可留空'},{name:'note',label:'训练备注',area:true,full:true}],async v=>{db.training.push({date:selectedDate,...v});await persist()})}
function addWellness(){const old=dayRows('wellness')[0]||{};modal('记录身体状态','身高会保存为个人资料；输入身高和体重后自动计算 BMI。',[{name:'height',label:'身高（cm）',type:'number',value:db.settings.height||old.height||'',placeholder:'例如：170'},{name:'weight',label:'体重（kg）',type:'number',value:old.weight||'',placeholder:'例如：65'},{name:'bmiPreview',label:'BMI（自动计算）',preview:true,full:true},{name:'sleep',label:'睡眠（小时）',type:'number',value:old.sleep||'',placeholder:'可留空'},{name:'note',label:'状态备注',area:true,full:true,value:old.note||'',placeholder:'精神、饥饿感或恢复情况'}],async v=>{const height=Number(v.height)||Number(db.settings.height)||0,weight=Number(v.weight)||0;db.settings.height=height;db.wellness=db.wellness.filter(x=>x.date!==selectedDate);db.wellness.push({date:selectedDate,height,weight:v.weight,sleep:v.sleep,note:v.note,bmi:height>0&&weight>0?Number((weight/((height/100)**2)).toFixed(1)):''});await persist()})}
function editGoals(){modal('编辑每日目标','目标用于帮助观察习惯，可随时按自己的需要调整。',[{name:'calories',label:'热量目标（kcal）',type:'number',value:db.settings.calories,required:true},{name:'protein',label:'蛋白质目标（g）',type:'number',value:db.settings.protein,required:true}],async v=>{db.settings={...db.settings,calories:Number(v.calories)||2000,protein:Number(v.protein)||140};await persist()})}
function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2800)}
document.addEventListener('click',async e=>{const add=e.target.closest('[data-add]');if(add){({meal:addMeal,training:addTraining,wellness:addWellness}[add.dataset.add])();return}const tab=e.target.closest('[data-tab]');if(tab){activeTab=tab.dataset.tab;renderLog();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===tab));return}const del=e.target.closest('[data-delete]');if(del){const key=del.dataset.delete;const rows=dayRows(key);rows.splice(Number(del.dataset.index),1);db[key]=db[key].filter(x=>x.date!==selectedDate).concat(rows);await persist();render();return}});
$('#date').addEventListener('change',e=>{selectedDate=e.target.value;render()});$('#todayBtn').onclick=()=>{$('#date').value=new Date().toISOString().slice(0,10);selectedDate=$('#date').value;render()};$('#goalBtn').onclick=editGoals;$('#exportBtn').onclick=()=>{const rows=[['类型','日期','时间','餐次/项目','内容','热量 kcal','蛋白质 g','身高 cm','体重 kg','BMI','睡眠小时','备注']];db.meals.forEach(x=>rows.push(['饮食',x.date,x.time,x.meal,x.foods,x.kcal,x.protein,'','','','',x.note]));db.training.forEach(x=>rows.push(['训练',x.date,x.time,x.type,x.details,'','','','','','',x.note]));db.wellness.forEach(x=>rows.push(['状态',x.date,'','身体状态','', '', '',x.height||db.settings.height||'',x.weight||'',x.bmi||bmiFor(x.weight,x.height||db.settings.height)||'',x.sleep||'',x.note||'']));const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='饮食训练记录.csv';a.click();URL.revokeObjectURL(a.href)};
init();
</script></body></html>
